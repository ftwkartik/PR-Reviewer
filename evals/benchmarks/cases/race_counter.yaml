id: race_counter
kind: seeded
title: Persist counters to the store on every bump
body: Adds a flush to the backing store so counters survive restarts.
edits:
  app/api/stats.py:
    - old: |
        @router.post("/stats/{name}")
        async def bump(name: str):
            async with _lock:
                COUNTERS[name] = COUNTERS.get(name, 0) + 1
                return {"name": name, "count": COUNTERS[name]}
      new: |
        async def flush_to_store(name: str, value: int) -> None:
            await asyncio.sleep(0)


        @router.post("/stats/{name}")
        async def bump(name: str):
            current = COUNTERS.get(name, 0)
            await flush_to_store(name, current + 1)
            COUNTERS[name] = current + 1
            return {"name": name, "count": COUNTERS[name]}
expected:
  - file: app/api/stats.py
    contains: "COUNTERS[name] = current + 1"
    categories: [concurrency, correctness]
    min_severity: medium
    required_context: []
