[project]
name = "pr-review-agent"
version = "0.1.0"
description = "Repository-aware AI pull request review agent (RAG)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "httpx>=0.27",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "pyjwt[crypto]>=2.9",
  "anthropic>=0.40",
  "tenacity>=9.0",
  "pathspec>=0.12",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "ruff>=0.16.9",
  "bandit>=1.9.4",
  "semgrep>=1.79.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "fakeredis>=2.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pyyaml>=6.0.3",
  "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/fixtures", "evals/benchmarks"]
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "E501"]
"app/review/prompts.py" = ["E501"]
"evals/**" = ["E501", "S101"]
"scripts/**" = ["E501", "S311"]
"alembic/versions/*" = ["E501", "I001", "UP007"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["evals/benchmarks", "tests/fixtures"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real external services (excluded from CI)"]

[tool.setuptools.packages.find]
include = ["app*"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "pgvector.*", "tree_sitter_python.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.workers.*"
disallow_untyped_decorators = false
