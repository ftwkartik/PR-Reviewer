x-app: &app
  build: .
  env_file: [.env]
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://review:review@postgres:5432/review
    REDIS_URL: redis://redis:6379/0
    # Containers reach the host's Ollama through the pinned bridge's gateway (see `networks`).
    # .env keeps OLLAMA_BASE_URL=http://localhost:11434 for host-side runs (tests, evals).
    OLLAMA_BASE_URL: http://host.docker.internal:11434
  extra_hosts:
    - "host.docker.internal:172.28.0.1"
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: review, POSTGRES_PASSWORD: review, POSTGRES_DB: review}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
  api:
    <<: *app
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    <<: *app
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "review,index", "-c", "2", "--loglevel=INFO"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      <<: *app-env
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom_multiproc  # aggregate metrics from pool children
    tmpfs: ["/tmp:size=1g"]
    expose: ["9102"]  # worker Prometheus endpoint

# Fixed bridge name + subnet so ONE firewall rule can allow compose -> host Ollama:
#   sudo ufw allow in on prbr0 to any port 11434 proto tcp
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: prbr0
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  pgdata:
