x-app: &app
  build: .
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql+asyncpg://review:review@postgres:5432/review
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: review, POSTGRES_PASSWORD: review, POSTGRES_DB: review}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
  api:
    <<: *app
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    <<: *app
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "review,index", "-c", "2", "--loglevel=INFO"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    tmpfs: ["/tmp:size=1g"]
    expose: ["9102"]  # worker Prometheus endpoint

volumes:
  pgdata:
